version: 2

# Dependabot keeps the SHA-pinned actions in .github/workflows fresh (convention C5).
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days. If a package is compromised that is usually noticed within that window;
# without the wait the bad version would sit in a PR immediately.
#
# Public repo: Dependabot runs as free hosted Actions jobs. It cannot read
# repository secrets. Merge its PRs only after `validate` ran on them (C9).
#
# Only github-actions for now: the validator and its tests are standard library only
# (there are no Python packages to track; the CI-only ruff pin sits in validate.yml).
# Add `cargo` / `npm` blocks (same cooldown) when the Tauri app is scaffolded.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
