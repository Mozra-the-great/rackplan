name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependency install step on purpose — the validator and its tests are
      # standard library only, and should stay that way.
      - name: Validate brand dataset
        run: python3 scripts/validate_brands.py

      - name: Test the validator
        run: python3 -m unittest discover -s tests -v
