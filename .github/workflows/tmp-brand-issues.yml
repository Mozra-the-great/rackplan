name: tmp-brand-issues

# Temporary: creates one catalogue issue per brand, then this file is deleted again.
on:
  push:
    branches: [claude/sharp-shannon-f9g2f3]
    paths: [.github/workflows/tmp-brand-issues.yml]

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create brand issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/tmp_create_brand_issues.py
